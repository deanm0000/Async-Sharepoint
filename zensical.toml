[project]
site_name = "Async Sharepoint"
site_url = "https://deanm0000.github.io/Async-Sharepoint/"
repo_url = "https://github.com/deanm0000/Async-Sharepoint"
repo_name = "deanm0000/Async-Sharepoint"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Eager and parallel fetching" = "parallel_eager.md" },
  { "Authentication" = "auth.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
