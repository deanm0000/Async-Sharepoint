[package]
name = "async-sharepoint"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Async SharePoint REST client for Rust"
repository = "https://github.com/deanm0000/Async-Sharepoint"
homepage = "https://github.com/deanm0000/Async-Sharepoint"
documentation = "https://docs.rs/async-sharepoint"
keywords = ["sharepoint", "microsoft", "async"]
categories = ["api-bindings", "asynchronous"]

[features]
python = ["dep:pyo3"]

[dependencies]
base64 = "0.23.1"
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
pyo3 = { version = "0.29.2", optional = true }
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
